<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cabin-portfolio</title>
  </head>
  <body>
    <div id="loading-screen">
      <div id="loading-blocks"></div> 

      <div class="loading-container">
        <div id="loading-text">INITIALIZING... 0%</div>
        <div class="loading-bar-border">
          <div id="loading-bar"></div>
        </div>
      </div>
    </div>
    <div id="white-fade-overlay"></div>
    <div id="black-fade-overlay"></div>
    <div id="ae-image-overlay">
      <div id="ae-assets-scrollbox">
    
        <div class="ae-asset-item" data-type="original">
          <img src="/images/video_symbol.png" alt="Video Icon" class="ae-asset-icon">
          <span class="ae-asset-text">my_portfolio.mp4</span>
        </div>

        <div class="ae-asset-item" data-type="youtube" data-youtube-id="AggZgbMLc4c">
          <img src="/images/video_symbol.png" alt="Video Icon" class="ae-asset-icon">
          <span class="ae-asset-text">ray_optics_educational_short.mp4</span>
        </div>
         <!-- when needed to add more videos to the ae assets, put the image in videos, copy paste the div block above
        and just change the path and the text -->

      </div>
      <select id="ae-mobile-dropdown">
        <option value="" disabled selected>Select a Project...</option>
        <option value="original">my_portfolio.mp4</option>
        
        <option value="AggZgbMLc4c">ray_optics_educational_short.mp4</option>
        <!-- make sure to also make it compatible with mobile devices -->
      </select>
    </div>
    <div id="black-bg-layer"></div>

    <div id="screenshot-container">
      <iframe id="youtube-player" src="" frameborder="0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen style="display: none;"></iframe>
      <img id="scene-screenshot" src="/images/scene_ss.png" alt="Paused Scene">
      <div id="grey-overlay"></div>
      <div id="play-button">▶</div>
    </div>
    <div id="github-bubble">See what I'm cooking next!</div>
    
    <img id="back-button" src="/images/backarrow.png" alt="Go Back" />
    <div id="audio-toggle">SOUND: OFF</div>
    <div id="app"></div>
    <div id="experience">
      <canvas id="experience-canvas" class="experience-canvas"></canvas>
      <canvas id="cursor-canvas"></canvas>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
